<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synergy Guild Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/scripts.js') }}" defer></script>
</head>
<body>
    <header>
        <h1>Synergy Guild Manager</h1>
    </header>
    <main>
        </section>
        <div>
            <table id="guildmembers-table">
                <caption id="guildmembers-caption">Guild Members</caption>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Class</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for member in members %}
                        <tr>
                            <td>{{ member.name }}</td>
                            <td class="{{ member.class_name | lower }}">{{ member.class_name }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
            </table>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Synergy Guild Manager</p>
    </footer>
</body>
</html>
