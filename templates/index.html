<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synergy Guild Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/scripts.js') }}" defer></script>
</head>
<body>
    <header>
        <h1>Synergy Guild Manager</h1>
    </header>
    <main>
        <h2>Update Guild Members</h2>

        <button type="button" id="add-member-button">
            Add Guildmember
        </button>

        <form id="add-member-form" hidden>
            <div class="form-row">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name"required>
            </div>
            
            <div class="form-row">
                <label for="class_name">Class:</label>
                <select id="class_name" name="class_name" required>
                    <option value="">Select a class</option>
                    <option value="Warrior">Warrior</option>
                    <option value="Mage">Mage</option>
                    <option value="Rogue">Rogue</option>
                    <option value="Priest">Priest</option>
                    <option value="Hunter">Hunter</option>
                    <option value="Paladin">Paladin</option>
                    <option value="Druid">Druid</option>
                    <option value="Shaman">Shaman</option>
                    <option value="Warlock">Warlock</option>
                </select>
            </div>

            <button type="submit" id="add-member-form-button">Add</button>
            <p id="form-message"></p>
        </form>

    </main>
    <div>
        <p id="table-message"></p>
        <table id="guildmembers-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Class</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Synergy Guild Manager</p>
    </footer>
</body>
</html>
