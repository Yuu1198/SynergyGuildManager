<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synergy Guild Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/scripts.js') }}" defer></script>
</head>
<body>
    <header>
        <h1>Synergy Guild Manager</h1>
    </header>
    <main>
        <section>
            <h2>Welcome to the Synergy Guild Manager</h2>
            <p>Manage your guilds efficiently and effectively.</p>
        </section>
        <section>
            <h2>Features</h2>
            <ul>
                <li>Track guildies classes and levels</li>
                <li>Track guildies professions</li>
                <li>Organize raids</li>
            </ul>
        </section>
        <div class="guildmembers-container">
            <button id="guildmembers-button">View Guildmembers</button>
            <table id="guildmembers-table" hidden>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Class</th>
                    </tr>
                </thead>
                <tbody id="guildmembers-body"></tbody>
            </table>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Synergy Guild Manager</p>
    </footer>
</body>
</html>
